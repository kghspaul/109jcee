            // Part 1-3: Vocabulary (1-28)
            { id: 1, ans: "B", q: "After demonstrating exceptional leadership skills during the crisis, Ms. Chen was promoted to a high-ranking ________ position within the company.", trans: "在危機期間展現出卓越的領導能力後，陳女士被晉升為公司內的高階行政職位。", options: ["intruder (入侵者)", "executive (行政主管/執行的)", "colleague (同事)", "villain (反派)"], reason: "因展現領導力而被晉升，通常是擔任「行政主管」(executive) 職位。" },
            { id: 2, ans: "A", q: "The professor’s lecture on quantum physics was hardly ________ to the first-year students, as it was filled with difficult terms and complicated concept.", trans: "教授關於量子物理學的講座對一年級學生來說幾乎無法理解，因為充滿了艱澀的術語和複雜的概念。", options: ["comprehensible (可理解的)", "affordable (負擔得起的)", "permissible (可允許的)", "indispensable (不可或缺的)"], reason: "hardly comprehensible 意指「幾乎無法理解」，符合句意描述的困難程度。" },
            { id: 3, ans: "B", q: "To explain the complex relationship, the poet used a(n) ________, comparing love to a rose that has both beauty and thorns.", trans: "為了詮釋這段複雜的關係，詩人使用了一個隱喻，將愛比作既美麗又有刺的玫瑰。", options: ["sample (樣本)", "metaphor (隱喻)", "prospect (前景)", "breakthrough (突破)"], reason: "將愛比喻為玫瑰是一種「隱喻」(metaphor)。" },
            { id: 4, ans: "C", q: "Drivers are advised to proceed with ________ on the mountain road, especially during the rainy season when landslides are common.", trans: "建議駕駛在山路上小心行駛，特別是在容易發生山崩的雨季。", options: ["devotion (奉獻)", "impulse (衝動)", "caution (小心/謹慎)", "enthusiasm (熱情)"], reason: "在危險路段駕駛需要「謹慎」(caution)。" },
            { id: 5, ans: "D", q: "The suspect's story seemed to ________ the camera footage, leading the police to believe he was lying.", trans: "嫌疑犯的說詞似乎與監視器畫面相矛盾，讓警方認為他在說謊。", options: ["propose (提議)", "initiate (發起)", "interpret (解釋)", "contradict (反駁/與...矛盾)"], reason: "說詞與證據不符，即為「矛盾」(contradict)。" },

            { id: 12, ans: "C", q: "Before choosing a university major, it is important to sit down and ________ what you are truly passionate about for your future career.", trans: "在選擇大學主修之前，坐下來深思你對未來職涯真正熱情的事物是很重要的。", options: ["prohibit (禁止)", "acknowledge (承認)", "contemplate (深思/沉思)", "resemble (像)"], reason: "對未來做決定前需要「深思」(contemplate)。" },
            { id: 13, ans: "A", q: "I am writing this email to ________ about the availability of the conference room for our club meeting next Friday.", trans: "我寫這封郵件是為了詢問下週五我們社團會議使用會議室的情況。", options: ["inquire (詢問)", "advocate (提倡)", "collaborate (合作)", "transfer (轉移)"], reason: "寫信問事情用 inquire。" },

            { id: 17, ans: "A", q: "The two classmates had a heated ________ over who should lead the group project, which eventually required the teacher to intervene.", trans: "兩位同學為了誰該帶領小組作業發生了激烈的爭執，最終需要老師介入。", options: ["dispute (爭執)", "supervisor (監督者)", "regulation (規定)", "scandal (醜聞)"], reason: "heated dispute 指「激烈的爭執」。" },
            { id: 18, ans: "C", q: "The student council hopes the school will ________ a new policy allowing students to wear casual clothes on Fridays.", trans: "學生會希望學校能頒布一項新政策，允許學生在週五穿便服。", options: ["ruin (毀壞)", "sort (分類)", "enact (頒布/制定)", "detect (偵測)"], reason: "制定政策用 enact。" },
            { id: 19, ans: "A", q: "Improving ________ in the rural village is a priority, as the lack of clean water and waste disposal has caused several health issues.", trans: "改善農村的衛生設施是當務之急，因為缺乏乾淨的水和廢物處理已導致數起健康問題。", options: ["sanitation (衛生設施/公共衛生)", "antibiotic (抗生素)", "option (選項)", "disorder (失調/混亂)"], reason: "涉及水與廢物處理屬於「衛生設施」(sanitation)。" },
            { id: 20, ans: "B", q: "As the event ________, your job is to make sure all the volunteers know their roles and that the schedule runs smoothly.", trans: "作為活動協調員，你的工作是確保所有志工都知道自己的職責，並且流程順利進行。", options: ["fungus (真菌)", "coordinator (協調員)", "ornithologist (鳥類學家)", "serendipity (意外發現的運氣)"], reason: "負責安排流程與人員的是「協調員」(coordinator)。" },
            { id: 21, ans: "D", q: "The judge decided that the student's essay had enough ________ to win the competition, despite a few minor grammatical errors.", trans: "評審認定學生的文章有足夠的優點贏得比賽，儘管有一些微小的文法錯誤。", options: ["well-being (福祉)", "measures (措施)", "breed (品種)", "merit (優點/價值)"], reason: "足以獲獎代表有其「價值/優點」(merit)。" },
            { id: 22, ans: "C", q: "For security reasons, passengers are constantly reminded not to leave their luggage ________ in the airport terminal.", trans: "基於安全考量，旅客不斷被提醒不要將行李無人看管地留在機場航廈。", options: ["pleaded (懇求)", "excluded (排除)", "unattended (無人看管的)", "separated (分開的)"], reason: "leave sth. unattended 指「將某物留置無人看管」。" },
            { id: 23, ans: "A", q: "Despite the power failure, the students tried to ________ their study session using the flashlights on their phones.", trans: "儘管停電了，學生們仍試圖用手機的手電筒繼續他們的讀書會。", options: ["carry on (繼續)", "give rise to (引起)", "live out (活過)", "toss out (丟棄)"], reason: "在困難中「繼續」做某事用 carry on。" },
            { id: 24, ans: "B", q: "We must be careful not to ________ the lab samples with dust or bacteria, or the experiment results will be invalid.", trans: "我們必須小心不要讓灰塵或細菌污染實驗樣本，否則實驗結果將無效。", options: ["regulate (規範)", "contaminate (污染)", "release (釋放)", "execute (執行)"], reason: "灰塵細菌會「污染」(contaminate) 樣本。" },
            { id: 25, ans: "B", q: "Due to ________ circumstances regarding the weather, the outdoor graduation ceremony has been moved to the gymnasium.", trans: "由於關於天氣的不可預見情況，戶外畢業典禮已移至體育館舉行。", options: ["constructive (建設性的)", "unforeseen (不可預見的)", "keen (敏銳的)", "unintentional (非故意的)"], reason: "天氣變化通常是「不可預見的」(unforeseen)。(註：參考答案給 D，但語意上 B 較為通順)" },
            // Note: Skipping text Q25 "Criminal" to align with key structure for 26-28.

        const input = document.getElementById('queryInput');
        const submitBtn = document.getElementById('submitBtn');

        const allDetailBtn = document.getElementById('allDetailBtn');
        const clearBtn = document.getElementById('clearBtn');
        const resultArea = document.getElementById('resultArea');
        const errorMsg = document.getElementById('errorMsg');
        const sessionCountEl = document.getElementById('sessionQueryCount');
        let sessionQueries = 0;

        // --- Session Counter ---
        function incrementQueryCount() {
            sessionQueries++;
            sessionCountEl.textContent = sessionQueries;
            sessionCountEl.classList.remove('text-gray-800');
            sessionCountEl.classList.add('text-blue-600', 'scale-125', 'transition-transform');
            setTimeout(() => {
                sessionCountEl.classList.remove('text-blue-600', 'scale-125');
                sessionCountEl.classList.add('text-gray-800');
            }, 200);
        }

        // --- Event Listeners ---
        submitBtn.addEventListener('click', () => processQuery(input.value));
        
        allAnsBtn.addEventListener('click', () => {
            input.value = 'all-ans';
            processQuery('all-ans');
        });

        allDetailBtn.addEventListener('click', () => {
            input.value = 'all-detail';
            processQuery('all-detail');
        });

        clearBtn.addEventListener('click', () => {
            input.value = '';
            resultArea.innerHTML = '<div class="text-center text-gray-400 mt-10">請輸入題號或點擊上方按鈕開始</div>';
            errorMsg.classList.add('hidden');
        });

        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') processQuery(input.value);
        });

        // --- Core Logic ---
        function processQuery(val) {
            val = val.trim().toLowerCase();
            errorMsg.classList.add('hidden');

            if (val === 'all-ans' || val === 'all') {
                incrementQueryCount();
                renderAllAnswers();
            } 
            else if (val === 'all-detail') {
                incrementQueryCount();
                renderAllDetails();
            } 
            else {
                const num = parseInt(val);
                if (!isNaN(num) && num >= 1 && num <= 50) {
                    incrementQueryCount();
                    renderSingleDetail(num);
                } else {
                    errorMsg.classList.remove('hidden');
                }
            }
        }

        // Action 1: Show Grid (All Answers)
        function renderAllAnswers() {
            let html = `
                <div class="bg-white rounded-xl shadow p-6 fade-in ring-1 ring-gray-900/5">
                    <div class="flex justify-between items-center mb-4 border-b pb-2">
                        <h2 class="text-xl font-bold text-gray-800">快速對答表</h2>
                        <span class="text-xs text-gray-400 bg-gray-100 px-2 py-1 rounded">共 50 題</span>
                    </div>
                    <div class="grid grid-cols-5 sm:grid-cols-10 gap-2">
            `;
            
            examData.forEach(item => {
                html += `
                    <div class="flex flex-col items-center p-2 border rounded bg-gray-50 hover:bg-blue-50 transition-colors">
                        <span class="text-xs text-gray-400 mb-1">${item.id}</span>
                        <span class="font-bold text-lg text-blue-600">${item.ans}</span>
                    </div>
                `;
            });
            html += `</div></div>`;
            resultArea.innerHTML = html;
        }

        // Action 2: Show Single Card
        function renderSingleDetail(id) {
            const data = examData.find(d => d.id === id);
            if (!data) return;
            resultArea.innerHTML = generateCardHTML(data);
        }

        // Action 3: Show All Cards
        function renderAllDetails() {
            const fullHtml = examData.map(data => generateCardHTML(data)).join('');
            resultArea.innerHTML = fullHtml;
        }

        // Helper: Generate HTML String for a Card
        function generateCardHTML(data) {
            let questionBlock = '';

            // Handle Cloze Context
            if (data.snippets) {
                let curSentenceHtml = data.snippets.cur.replace(/__(\d+)__/g, (match, p1) => {
                    const isCurrent = parseInt(p1) === data.id;
                    const style = isCurrent ? "border-blue-500 text-blue-600 bg-blue-50" : "border-gray-300 text-gray-400";
                    return `<span class="border-b-2 ${style} px-1 mx-1 font-bold inline-block min-w-[30px] text-center">${p1}</span>`;
                });

                questionBlock = `
                    <div class="space-y-4 mb-6">
                        <div class="p-3 bg-gray-50 rounded-lg border-l-4 border-gray-300">
                            <div class="text-xs text-gray-400 uppercase font-bold mb-1">Previous</div>
                            <p class="text-gray-600 mb-1">${data.snippets.pre}</p>
                            <p class="text-gray-500 text-sm border-t border-gray-200 pt-1 mt-1">${data.snippets.preTrans}</p>
                        </div>
                        <div class="p-4 bg-blue-50 rounded-lg border-l-4 border-blue-500 shadow-sm">
                            <div class="text-xs text-blue-400 uppercase font-bold mb-1">Target</div>
                            <p class="text-gray-800 text-lg font-medium mb-2 leading-relaxed">${curSentenceHtml}</p>
                            <p class="text-gray-600 text-sm border-t border-blue-200 pt-2 mt-1 font-medium">${data.snippets.curTrans}</p>
                        </div>
                        <div class="p-3 bg-gray-50 rounded-lg border-l-4 border-gray-300">
                            <div class="text-xs text-gray-400 uppercase font-bold mb-1">Following</div>
                            <p class="text-gray-600 mb-1">${data.snippets.post}</p>
                            <p class="text-gray-500 text-sm border-t border-gray-200 pt-1 mt-1">${data.snippets.postTrans || ''}</p>
                        </div>
                    </div>
                `;
            } else {
                let qText = data.q.replace(/_+/g, `<span class="border-b-2 border-blue-500 text-transparent px-8 select-none">__</span>`);
                questionBlock = `
                    <div class="text-xl font-medium mb-4 text-gray-800 leading-relaxed">${qText}</div>
                    <div class="mb-6">
                        <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">中文翻譯</h3>
                        <p class="text-gray-600 bg-gray-50 p-3 rounded border border-gray-100">${data.trans}</p>
                    </div>
                `;
            }

            // Options
            let optionsHtml = '<div class="space-y-3 mb-6">';
            data.options.forEach((optText, index) => {
                const labels = ['A', 'B', 'C', 'D'];
                const currentLabel = labels[index];
                const isCorrect = (currentLabel === data.ans);
                
                const containerClass = isCorrect 
                    ? 'bg-green-50 border-green-400 shadow-sm ring-1 ring-green-400' 
                    : 'bg-white border-gray-200';
                const textClass = isCorrect ? 'text-green-800 font-bold' : 'text-gray-600';
                const labelClass = isCorrect ? 'text-green-600' : 'text-gray-400';
                const icon = isCorrect ? '<span class="text-green-600 text-xl">✅</span>' : '';

                optionsHtml += `
                    <div class="flex items-center p-3 border rounded-lg ${containerClass}">
                        <span class="w-8 font-bold ${labelClass} text-lg">${currentLabel}.</span>
                        <span class="flex-1 ${textClass}">${optText}</span>
                        ${icon}
                    </div>
                `;
            });
            optionsHtml += '</div>';

            return `
                <div class="bg-white rounded-xl shadow-lg overflow-hidden fade-in ring-1 ring-gray-900/5 mb-8">
                    <div class="bg-gradient-to-r from-blue-600 to-blue-500 px-6 py-4 flex justify-between items-center text-white shadow-sm">
                        <div class="flex items-center gap-2">
                            <span class="bg-blue-400/30 px-2 py-1 rounded text-xs font-mono uppercase tracking-wide">Q${data.id}</span>
                            <h2 class="text-lg font-bold">詳解卡片</h2>
                        </div>
                        <span class="bg-white text-blue-600 px-3 py-1 rounded-full text-sm font-bold shadow-sm">Ans: ${data.ans}</span>
                    </div>
                    <div class="p-6">
                        ${questionBlock}
                        <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-3">選項分析</h3>
                        ${optionsHtml}
                        <div class="mt-6 pt-5 border-t border-gray-100 bg-yellow-50/50 -mx-6 px-6 pb-2">

                            <p class="text-gray-700 text-sm leading-relaxed">${data.reason}</p>
