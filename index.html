        function extractSentence(text, questionId) {
            const targetPattern = new RegExp(`__+${questionId}__+`, 'g');
            const match = targetPattern.exec(text);
            
            if (!match) return "無法定位題目句，請參考完整文章。";

            const targetIndex = match.index;

            let startIndex = 0;
            for (let i = targetIndex; i >= 0; i--) {
                const char = text[i];
                if (['.', '?', '!'].includes(char)) {
                    startIndex = i + 1;
                    break;
                }
            }

            let endIndex = text.length;
            for (let i = targetIndex; i < text.length; i++) {
                if (['.', '?', '!'].includes(text[i])) {
                    endIndex = i + 1;
                    break;
                }
            }

            return text.substring(startIndex, endIndex).trim();
        }
